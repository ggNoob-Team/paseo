name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version label for the APK filename."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build app dependencies
        run: npm run build:app-deps

      - name: Generate Android project
        env:
          APP_VARIANT: production
          CI: "1"
        run: |
          set -euo pipefail
          cd packages/app
          npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          cd packages/app/android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Stage APK
        env:
          PASEO_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          label="${PASEO_VERSION:-${GITHUB_SHA::12}}"
          mkdir -p "$RUNNER_TEMP/apk"
          cp packages/app/android/app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/apk/paseo-${label}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/*.apk
          retention-days: 14
