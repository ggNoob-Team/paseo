name: Publish Daemon NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the @ggnoob-team/paseo package."
        required: true
        default: "0.9.0-archify.1"
        type: string
      dist_tag:
        description: "npm dist-tag to publish."
        required: true
        default: "archify"
        type: string
      publish:
        description: "Publish the packed tarball to GitHub Packages."
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@ggnoob-team"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack daemon npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          set -euo pipefail
          node scripts/pack-github-daemon-packages.mjs \
            --version "${{ inputs.version }}" \
            --output "$RUNNER_TEMP/paseo-npm"

      - name: Upload package artifact
        if: inputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paseo-github-package
          path: ${{ runner.temp }}/paseo-npm/*.tgz
          retention-days: 7

      - name: Publish to GitHub Packages
        if: inputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r tarball; do
            npm publish "$tarball" \
              --tag "${{ inputs.dist_tag }}" \
              --registry https://npm.pkg.github.com
          done < "$RUNNER_TEMP/paseo-npm/publish-manifest.txt"

      - name: Verify GitHub Packages publication
        if: inputs.publish == 'true'
        timeout-minutes: 5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/paseo-package.json"
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            https://npm.pkg.github.com/@ggnoob-team%2fpaseo > "$metadata"
          node - "$metadata" "${{ inputs.version }}" <<'NODE'
          const fs = require("node:fs");
          const metadata = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const version = process.argv[3];
          if (!metadata.versions?.[version]) {
            throw new Error(`@ggnoob-team/paseo@${version} is not published`);
          }
          process.stdout.write(`verified @ggnoob-team/paseo@${version}\n`);
          NODE
